# Builds the spatial APK from the source on the selected branch.
name: Build spatial APK

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: 'Source version to build'
        required: true
        type: choice
        default: current
        options:
          - current
          - previous-v6
  push:
    branches:
      - arena/3b695412-v2ray-newface

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source (with submodules)
      uses: actions/checkout@v7
      with:
        # The previous source stays immutable even as this branch advances.
        ref: ${{ inputs.source_version == 'previous-v6' && '265b743993b7f704c8c216f089c7b2ecabf60c71' || github.sha }}
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: bash compile-hevtun.sh

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Test and build arm64 debug APK
      shell: bash
      run: |
        cd "${{ github.workspace }}/V2rayNG"
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set +e
        ./gradlew :app:testFdroidDebugUnitTest :app:assembleFdroidDebug -PABI_FILTERS=arm64-v8a 2>&1 | tee "$RUNNER_TEMP/gradle-spatial.log"
        result=${PIPESTATUS[0]}
        if [ "$result" -ne 0 ]; then
          grep -E '^(e: |error: |Execution failed for task|[[:space:]]*> )' "$RUNNER_TEMP/gradle-spatial.log" | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit "$result"
        fi

    - name: Test and assemble Play Store debug
      shell: bash
      run: |
        cd "${{ github.workspace }}/V2rayNG"
        ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a

    - name: Test and assemble Newface debug
      if: inputs.source_version != 'previous-v6'
      shell: bash
      run: |
        cd "${{ github.workspace }}/V2rayNG"
        ./gradlew :app:testNewfaceDebugUnitTest :app:assembleNewfaceDebug \
          -PABI_FILTERS=arm64-v8a -PNEWFACE_VERSION_CODE="${{ github.run_number }}"

    - name: Verify Newface debug package identity
      if: inputs.source_version != 'previous-v6'
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t apks < <(find V2rayNG/app/build/outputs/apk/newface/debug -name '*arm64-v8a*.apk')
        test "${#apks[@]}" -eq 1
        badging=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "${apks[0]}")
        printf '%s\n' "$badging" | grep -F "package: name='com.v2ray.ang.newface' versionCode='${{ github.run_number }}'"
        printf '%s\n' "$badging" | grep -F "application-label:'v2ray Newface'"
        shortcuts=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump xmltree "${apks[0]}" res/xml/shortcuts.xml)
        printf '%s\n' "$shortcuts" | grep -F 'com.v2ray.ang.newface'
        if printf '%s\n' "$shortcuts" | grep -F 'com.v2ray.ang.fdroid'; then
          echo '::error::Newface shortcuts target the F-Droid app.'
          exit 1
        fi

    - name: Verify and upload Newface debug APK
      if: inputs.source_version != 'previous-v6'
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t apks < <(find V2rayNG/app/build/outputs/apk/newface/debug -name '*arm64-v8a*.apk')
        test "${#apks[@]}" -eq 1
        "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "${apks[0]}"
        APK_PATH="${apks[0]}" python3 - <<'PYCODE'
        import os
        from zipfile import ZipFile

        with ZipFile(os.environ['APK_PATH']) as apk:
            names = set(apk.namelist())
            required = {f'lib/arm64-v8a/{name}' for name in (
                'libgojni.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so'
            )}
            missing = required - names
            unexpected = {name.split('/')[1] for name in names
                          if name.startswith('lib/') and len(name.split('/')) > 2
                          and name.split('/')[1] != 'arm64-v8a'}
            if missing or unexpected:
                raise SystemExit(f'Missing libraries: {missing}; unexpected ABIs: {unexpected}')
        PYCODE

    - name: Upload Newface debug APK for testing only
      if: inputs.source_version != 'previous-v6'
      uses: actions/upload-artifact@v7
      with:
        # Each runner creates a different debug key. This APK cannot be upgraded reliably.
        name: newface-arm64-debug-testing-only
        if-no-files-found: error
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/newface/debug/*arm64-v8a*.apk

    - name: Test Newface release signing with an ephemeral key
      if: inputs.source_version != 'previous-v6'
      shell: bash
      run: |
        set -euo pipefail
        key="$RUNNER_TEMP/ci-newface-test.p12"
        trap 'rm -f "$key"' EXIT
        keytool -genkeypair -keystore "$key" -storetype PKCS12 \
          -alias ci-test -storepass ci-test-password -keypass ci-test-password \
          -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Temporary CI test'
        cd "${{ github.workspace }}/V2rayNG"
        ./gradlew :app:assembleNewfaceRelease -PABI_FILTERS=arm64-v8a \
          -PNEWFACE_VERSION_CODE="${{ github.run_number }}" \
          -Pandroid.injected.signing.store.file="$key" \
          -Pandroid.injected.signing.store.password=ci-test-password \
          -Pandroid.injected.signing.key.alias=ci-test \
          -Pandroid.injected.signing.key.password=ci-test-password
        mapfile -t apks < <(find app/build/outputs/apk/newface/release -name '*arm64-v8a*.apk')
        test "${#apks[@]}" -eq 1
        "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "${apks[0]}"
        # This test key is discarded and its APK must never be uploaded or installed.
        rm -f "${apks[0]}"

    - name: Check Newface signing configuration
      if: inputs.source_version != 'previous-v6'
      id: newface_signing
      env:
        STORE: ${{ secrets.NEWFACE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.NEWFACE_KEYSTORE_PASSWORD }}
        ALIAS: ${{ secrets.NEWFACE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.NEWFACE_KEY_PASSWORD }}
        CERT_SHA256: ${{ secrets.NEWFACE_CERT_SHA256 }}
      shell: bash
      run: |
        if [[ -n "$STORE" && -n "$STORE_PASSWORD" && -n "$ALIAS" && -n "$KEY_PASSWORD" && -n "$CERT_SHA256" ]]; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'available=false' >> "$GITHUB_OUTPUT"
          echo '::warning::Newface signing secrets are not configured. No installable Newface release will be uploaded; see NEWFACE_SIGNING.fa.md.'
        fi

    - name: Build and verify signed Newface release
      if: inputs.source_version != 'previous-v6' && steps.newface_signing.outputs.available == 'true'
      env:
        STORE: ${{ secrets.NEWFACE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.NEWFACE_KEYSTORE_PASSWORD }}
        ALIAS: ${{ secrets.NEWFACE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.NEWFACE_KEY_PASSWORD }}
        CERT_SHA256: ${{ secrets.NEWFACE_CERT_SHA256 }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        key="$RUNNER_TEMP/newface-signing.p12"
        trap 'rm -f "$key"' EXIT
        printf '%s' "$STORE" | base64 --decode > "$key"
        cd "${{ github.workspace }}/V2rayNG"
        ./gradlew :app:assembleNewfaceRelease -PABI_FILTERS=arm64-v8a \
          -PNEWFACE_VERSION_CODE="${{ github.run_number }}" \
          -Pandroid.injected.signing.store.file="$key" \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
        mapfile -t apks < <(find app/build/outputs/apk/newface/release -name '*arm64-v8a*.apk')
        test "${#apks[@]}" -eq 1
        "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "${apks[0]}" | \
          grep -F "package: name='com.v2ray.ang.newface' versionCode='${{ github.run_number }}'"
        signature=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "${apks[0]}")
        actual=$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':')
        expected=$(printf '%s' "$CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
        [[ "$expected" =~ ^[a-f0-9]{64}$ && "$actual" == "$expected" ]] || { echo '::error::Newface signing certificate does not match the pinned fingerprint.'; exit 1; }
        APK_PATH="${apks[0]}" python3 - <<'PYCODE'
        import os
        from zipfile import ZipFile

        with ZipFile(os.environ['APK_PATH']) as apk:
            names = set(apk.namelist())
            required = {f'lib/arm64-v8a/{name}' for name in (
                'libgojni.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so'
            )}
            missing = required - names
            unexpected = {name.split('/')[1] for name in names
                          if name.startswith('lib/') and len(name.split('/')) > 2
                          and name.split('/')[1] != 'arm64-v8a'}
            if missing or unexpected:
                raise SystemExit(f'Missing libraries: {missing}; unexpected ABIs: {unexpected}')
        PYCODE

    - name: Upload signed Newface arm64 APK
      if: inputs.source_version != 'previous-v6' && steps.newface_signing.outputs.available == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: newface-arm64-signed
        if-no-files-found: error
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/newface/release/*arm64-v8a*.apk

    - name: Verify arm64 native libraries
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        from zipfile import ZipFile

        apks = list(Path('V2rayNG/app/build/outputs/apk/fdroid/debug').glob('*arm64-v8a*.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected one arm64 APK, got {len(apks)}')
        with ZipFile(apks[0]) as apk:
            names = set(apk.namelist())
            required = {f'lib/arm64-v8a/{name}' for name in (
                'libgojni.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so'
            )}
            missing = required - names
            other_abis = {name.split('/')[1] for name in names
                          if name.startswith('lib/') and len(name.split('/')) > 2
                          and name.split('/')[1] != 'arm64-v8a'}
            if missing or other_abis:
                raise SystemExit(f'Missing native libraries: {missing}; unexpected ABIs: {other_abis}')
        print(f'Validated {apks[0]} ({apks[0].stat().st_size} bytes)')
        PY

    - name: Upload arm64 APK
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.source_version == 'previous-v6' && 'spatial-previous-v6-arm64-debug' || 'spatial-arm64-debug' }}
        if-no-files-found: error
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug/*arm64-v8a*.apk

    - name: Lint test options sheet (Play Store and F-Droid)
      if: inputs.source_version != 'previous-v6'
      shell: bash
      run: |
        cd "${{ github.workspace }}/V2rayNG"
        ./gradlew :app:lintPlaystoreDebug :app:lintFdroidDebug -PABI_FILTERS=arm64-v8a
