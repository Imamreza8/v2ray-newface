# An explicitly separate compatibility build: the regular Newface build keeps its API-24 baseline.
name: Build Android 6 Newface APK

on:
  push:
    branches:
      - arena/c15069a4-v2ray-newface
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - name: Install the native compiler
        shell: bash
        run: |
          set -euo pipefail
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup the Go version pinned by the native core
        uses: actions/setup-go@v6
        with:
          go-version-file: AndroidLibXrayLite/go.mod
          cache-dependency-path: AndroidLibXrayLite/go.sum
      - name: Build the pinned Xray library for API 23
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git submodule status AndroidLibXrayLite
          cd AndroidLibXrayLite
          # The upstream build generates this required third asset before gomobile bind.
          # Pin the Git blob instead of silently taking a changing latest release.
          gh api repos/Loyalsoldier/geoip/git/blobs/15085ec3a1ea17832c1952ed3808cdd45134fcea --jq .content | base64 -d > assets/geoip-only-cn-private.dat
          test "$(git hash-object assets/geoip-only-cn-private.dat)" = 15085ec3a1ea17832c1952ed3808cdd45134fcea
          unset GH_TOKEN
          export PATH="$(go env GOPATH)/bin:$PATH"
          mobile_version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gomobile@$mobile_version" "golang.org/x/mobile/cmd/gobind@$mobile_version"
          gomobile init
          set +e
          gomobile bind -v -androidapi 23 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./ 2>&1 | tee "$RUNNER_TEMP/android6-gomobile.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            tail -n 35 "$RUNNER_TEMP/android6-gomobile.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit "$result"
          fi
          mkdir -p ../V2rayNG/app/libs
          python3 ../.github/scripts/verify-geo-assets.py libv2ray.aar
          cp libv2ray.aar ../V2rayNG/app/libs/libv2ray.aar
      - name: Build both HEV native binaries for API 23
        shell: bash
        env:
          ANDROID_MIN_API: '23'
        run: |
          set -euo pipefail
          bash compile-hevtun.sh
          cp -r libs/* V2rayNG/app/libs/
      - name: Prepare verified Gradle distribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          distribution=$(sed -n 's#^distributionUrl=.*\(/gradle-[0-9.]*-bin.zip\)$#\1#p' gradle/wrapper/gradle-wrapper.properties)
          distribution=${distribution#/}
          version=${distribution#gradle-}
          version=${version%-bin.zip}
          [[ "$distribution" =~ ^gradle-[0-9.]+-bin\.zip$ ]]
          asset=$(gh api "repos/gradle/gradle-distributions/releases/tags/v${version}" --jq ".assets[] | select(.name == \"$distribution\") | [.id, .digest] | @tsv")
          unset GH_TOKEN
          IFS=$'\t' read -r asset_id digest <<< "$asset"
          [[ "$asset_id" =~ ^[0-9]+$ && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          curl --fail --location --retry 3 -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/$asset_id" -o "$RUNNER_TEMP/gradle-distribution.zip"
          echo "${digest#sha256:}  $RUNNER_TEMP/gradle-distribution.zip" | sha256sum --check
          sed -i '/^distributionUrl=/d' gradle/wrapper/gradle-wrapper.properties
          printf 'distributionUrl=file\\:%s\n' "$RUNNER_TEMP/gradle-distribution.zip" >> gradle/wrapper/gradle-wrapper.properties
      - name: Test and assemble Android 6 debug variants
        shell: bash
        run: |
          set -o pipefail
          cd V2rayNG
          set +e
          ./gradlew :app:testNewfaceDebugUnitTest :app:assembleNewfaceDebug :app:assembleNewfaceDebugAndroidTest :app:lintNewfaceDebug \
            -PNEWFACE_ANDROID6=true '-PABI_FILTERS=armeabi-v7a;arm64-v8a;x86_64' \
            -PNEWFACE_VERSION_CODE="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/android6-gradle.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/android6-gradle.log" <<'PY'
          import re, sys
          text = open(sys.argv[1], errors='replace').read().splitlines()
          patterns = re.compile(r'what went wrong|execution failed|manifest merger|uses-sdk|minsdk|minimum supported|requires|could not|^e: |^error:|error:|exception|FAILURE:', re.I)
          selected = set()
          for i, line in enumerate(text):
              if patterns.search(line):
                  selected.update(range(max(0, i - 1), min(len(text), i + 5)))
          from pathlib import Path
          reports = list(Path('app/build/reports').glob('lint-results-*.txt'))
          errors = []
          for path in reports:
              errors.extend(line.split('/V2rayNG/', 1)[-1] for line in path.read_text(errors='replace').splitlines() if ': Error: ' in line)
          report = ('\n'.join(errors) if errors else '\n'.join(text[i] for i in sorted(selected))[-12000:]) or '\n'.join(text[-40:])
          report = report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::Gradle diagnostics: ' + report)
          PY
            exit "$result"
          fi
      - name: Verify package, API level, signatures and native libraries
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mapfile -t apks < <(find V2rayNG/app/build/outputs/apk/newface/debug -name "*_${abi}.apk")
            test "${#apks[@]}" -eq 1
            badging=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "${apks[0]}")
            printf '%s\n' "$badging" | grep -F "package: name='com.v2ray.ang.newface' versionCode='${{ github.run_number }}'"
            printf '%s\n' "$badging" | grep -F "sdkVersion:'23'"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 23 "${apks[0]}"
            python3 .github/scripts/verify-geo-assets.py "${apks[0]}"
            APK_PATH="${apks[0]}" APK_ABI="$abi" python3 - <<'PY'
          import os
          from zipfile import ZipFile
          abi = os.environ['APK_ABI']
          with ZipFile(os.environ['APK_PATH']) as apk:
              names = set(apk.namelist())
              required = {f'lib/{abi}/{name}' for name in ('libgojni.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so')}
              missing = required - names
              actual = {name.split('/')[1] for name in names if name.startswith('lib/') and len(name.split('/')) > 2}
              if missing or actual != {abi}:
                  raise SystemExit(f'ABI {abi}: missing {missing}, packaged ABIs {actual}')
          PY
          done
      - name: Upload Android 6 debug APKs for testing only
        uses: actions/upload-artifact@v7
        with:
          # The runner key is temporary: these APKs are not guaranteed to update future builds.
          name: newface-android6-debug-testing-only
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/newface/debug/*.apk

      - name: Upload Android 6 instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: newface-android6-instrumentation
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/androidTest/newface/debug/*.apk

      - name: Upload Android 6 32-bit ARM test APK
        uses: actions/upload-artifact@v7
        with:
          name: newface-android6-armeabi-v7a-debug-testing-only
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/newface/debug/*_armeabi-v7a.apk
      - name: Upload Android 6 64-bit ARM test APK
        uses: actions/upload-artifact@v7
        with:
          name: newface-android6-arm64-v8a-debug-testing-only
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/newface/debug/*_arm64-v8a.apk

      - name: Test Android 6 release build with a disposable key
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/android6-ci-test.p12"
          trap 'rm -f "$key"' EXIT
          keytool -genkeypair -keystore "$key" -storetype PKCS12 \
            -alias ci-test -storepass ci-test-password -keypass ci-test-password \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Temporary CI test'
          cd V2rayNG
          ./gradlew :app:assembleNewfaceRelease -PNEWFACE_ANDROID6=true \
            '-PABI_FILTERS=armeabi-v7a;arm64-v8a' -PNEWFACE_VERSION_CODE="${{ github.run_number }}" \
            -Pandroid.injected.signing.store.file="$key" \
            -Pandroid.injected.signing.store.password=ci-test-password \
            -Pandroid.injected.signing.key.alias=ci-test \
            -Pandroid.injected.signing.key.password=ci-test-password
          for abi in armeabi-v7a arm64-v8a; do
            mapfile -t apks < <(find app/build/outputs/apk/newface/release -name "*_${abi}.apk")
            test "${#apks[@]}" -eq 1
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 23 "${apks[0]}"
            rm -f "${apks[0]}"
          done

      - name: Check permanent Android 6 signing prerequisites
        id: signing
        env:
          STORE: ${{ secrets.NEWFACE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEWFACE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.NEWFACE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEWFACE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NEWFACE_CERT_SHA256 }}
          RELEASE_CODE: ${{ vars.NEWFACE_ANDROID6_VERSION_CODE }}
        run: |
          if [[ -n "$STORE" && -n "$STORE_PASSWORD" && -n "$ALIAS" && -n "$KEY_PASSWORD" && -n "$CERT_SHA256" && "$RELEASE_CODE" =~ ^[0-9]+$ ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No signed Android 6 release: configure the five Newface signing secrets and the NEWFACE_ANDROID6_VERSION_CODE repository variable.'
          fi
      - name: Build and verify Android 6 permanently signed APKs
        if: steps.signing.outputs.available == 'true'
        env:
          STORE: ${{ secrets.NEWFACE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEWFACE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.NEWFACE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEWFACE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.NEWFACE_CERT_SHA256 }}
          RELEASE_CODE: ${{ vars.NEWFACE_ANDROID6_VERSION_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/newface-signing.p12"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$STORE" | base64 --decode > "$key"
          cd V2rayNG
          ./gradlew :app:assembleNewfaceRelease -PNEWFACE_ANDROID6=true \
            '-PABI_FILTERS=armeabi-v7a;arm64-v8a' -PNEWFACE_VERSION_CODE="$RELEASE_CODE" \
            -Pandroid.injected.signing.store.file="$key" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          expected=$(printf '%s' "$CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          for abi in armeabi-v7a arm64-v8a; do
            mapfile -t apks < <(find app/build/outputs/apk/newface/release -name "*_${abi}.apk")
            test "${#apks[@]}" -eq 1
            badging=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "${apks[0]}")
            printf '%s\n' "$badging" | grep -F "package: name='com.v2ray.ang.newface' versionCode='$RELEASE_CODE'"
            printf '%s\n' "$badging" | grep -F "sdkVersion:'23'"
            python3 ../.github/scripts/verify-geo-assets.py "${apks[0]}"
            signature=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --min-sdk-version 23 --print-certs "${apks[0]}")
            actual=$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':')
            [[ "$actual" == "$expected" ]] || { echo '::error::Unexpected signing certificate'; exit 1; }
            APK_PATH="${apks[0]}" APK_ABI="$abi" python3 - <<'PYCODE'
          import os
          from zipfile import ZipFile
          abi = os.environ['APK_ABI']
          with ZipFile(os.environ['APK_PATH']) as apk:
              names = set(apk.namelist())
              required = {f'lib/{abi}/{name}' for name in ('libgojni.so', 'libhev-socks5-tunnel.so', 'libhevsockstun.so')}
              actual = {name.split('/')[1] for name in names if name.startswith('lib/') and len(name.split('/')) > 2}
              if required - names or actual != {abi}:
                  raise SystemExit(f'ABI {abi}: missing {required - names}, packaged ABIs {actual}')
          PYCODE
          done
      - name: Upload signed Android 6 32-bit ARM APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: newface-android6-armeabi-v7a-signed
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/newface/release/*_armeabi-v7a.apk
      - name: Upload signed Android 6 64-bit ARM APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: newface-android6-arm64-v8a-signed
          if-no-files-found: error
          path: V2rayNG/app/build/outputs/apk/newface/release/*_arm64-v8a.apk

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: newface-android6-debug-testing-only
          path: android6-apks
      - uses: actions/download-artifact@v8
        with:
          name: newface-android6-instrumentation
          path: android6-test-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on an API 23 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android6-smoke.sh
